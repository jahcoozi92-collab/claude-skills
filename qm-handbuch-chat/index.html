<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM-Handbuch Assistent</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #dde3e8;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --bubble-user: #2563eb;
    --bubble-user-fg: #ffffff;
    --bubble-bot: #eef2f6;
    --bubble-bot-fg: #1f2937;
    --error: #b91c1c;
    --error-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --panel: #1b212b;
      --border: #2b333f;
      --text: #e5e9ef;
      --muted: #93a0b2;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --bubble-user: #3b82f6;
      --bubble-user-fg: #ffffff;
      --bubble-bot: #262e3a;
      --bubble-bot-fg: #e5e9ef;
      --error: #f87171;
      --error-bg: #2a1616;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  header {
    padding: 20px 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--bubble-bot-fg);
    border-bottom-left-radius: 4px;
  }
  .msg.bot.error {
    background: var(--error-bg);
    color: var(--error);
  }
  .msg .sources {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(127,127,127,0.25);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .msg.bot .sources { color: var(--muted); }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 4px 14px;
  }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 4px 20px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
    resize: none;
    font-family: inherit;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #send {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 0.95rem;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .welcome {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 8px 4px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>QM-Handbuch Assistent</h1>
    <p>Fragen zu QM-Handbuch, Pflegestandards &amp; MediFox &mdash; Antworten mit Quellenangabe, keine Vermutungen.</p>
  </header>

  <div id="chat">
    <div class="welcome">Stell deine Frage zum QM-Handbuch. Der Assistent antwortet nur, wenn er eine Quelle dafür findet.</div>
  </div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Frage eingeben…" autocomplete="off"></textarea>
    <button id="send" type="submit">Senden</button>
  </form>
</div>

<script>
(function () {
  // Ziel-Webhook des produktiven RAG-Chat-Workflows (RAG_Masterclass_Chat_hybrid,
  // n8n-Workflow-ID SJ47UX9mv8wh1Wwy). JSON-Endpoint, nicht der HTML-Endpoint
  // /webhook/medifox-chat.
  var WEBHOOK_URL = "https://n8n.forensikzentrum.com/webhook/rag-chat-api";

  var chatEl = document.getElementById("chat");
  var formEl = document.getElementById("composer");
  var inputEl = document.getElementById("input");
  var sendEl = document.getElementById("send");

  // n8n-Webhook-Antworten laufen teils in sandboxed context (origin: null) —
  // localStorage/sessionStorage kann dort mit SecurityError werfen. Deshalb
  // Zugriff try/catch-gekapselt, mit In-Memory-Fallback.
  var sessionId = null;
  (function initSession() {
    try {
      sessionId = sessionStorage.getItem("qm_chat_session");
      if (!sessionId) {
        sessionId = "qm-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
        sessionStorage.setItem("qm_chat_session", sessionId);
      }
    } catch (e) {
      sessionId = "qm-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    }
  })();

  function addMessage(role, text, sources) {
    var el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    if (sources && sources.length) {
      var s = document.createElement("div");
      s.className = "sources";
      s.textContent = "Quellen: " + sources.join(", ");
      el.appendChild(s);
    }
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }

  function addError(text) {
    var el = document.createElement("div");
    el.className = "msg bot error";
    el.textContent = text;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function setTyping(on) {
    var existing = document.getElementById("typing-indicator");
    if (on && !existing) {
      var el = document.createElement("div");
      el.id = "typing-indicator";
      el.className = "typing";
      el.textContent = "Assistent tippt…";
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
    } else if (!on && existing) {
      existing.remove();
    }
  }

  // Antwortformat des Workflows ist nicht fest dokumentiert — verschiedene
  // n8n "Respond to Webhook"-Konfigurationen liefern unterschiedliche Keys.
  // Robust gegen output/response/text/answer/message; bei Bedarf hier
  // den tatsächlich beobachteten Key ergänzen.
  function extractAnswer(data) {
    if (typeof data === "string") return data;
    if (!data || typeof data !== "object") return null;
    var candidate = data.output || data.response || data.text || data.answer || data.message;
    if (candidate) return candidate;
    if (Array.isArray(data) && data[0]) return extractAnswer(data[0].json || data[0]);
    return null;
  }

  function extractSources(data) {
    if (!data || typeof data !== "object") return [];
    var s = data.sources || data.quellen || data.citations;
    if (Array.isArray(s)) return s.map(String);
    return [];
  }

  async function sendMessage(text) {
    addMessage("user", text);
    setTyping(true);
    sendEl.disabled = true;

    try {
      var res = await fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId: sessionId, chatInput: text })
      });

      setTyping(false);

      if (!res.ok) {
        addError("Entschuldigung, der Assistent hat mit Status " + res.status + " geantwortet. Bitte später erneut versuchen.");
        return;
      }

      var raw = await res.text();
      if (!raw) {
        // Bekanntes Fehlerbild: leere 200-Antwort bei ausgefallenem LLM-Provider.
        addError("Entschuldigung, ein Fehler ist aufgetreten (leere Antwort). Bitte in ein paar Minuten erneut versuchen.");
        return;
      }

      var data;
      try { data = JSON.parse(raw); } catch (e) { data = raw; }

      var answer = extractAnswer(data);
      if (!answer) {
        addError("Entschuldigung, die Antwort konnte nicht gelesen werden. Bitte die QMB kontaktieren.");
        return;
      }

      addMessage("bot", answer, extractSources(data));
    } catch (err) {
      setTyping(false);
      addError("Entschuldigung, der Assistent ist gerade nicht erreichbar. Bitte später erneut versuchen.");
    } finally {
      sendEl.disabled = false;
    }
  }

  formEl.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendMessage(text);
  });

  inputEl.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener("input", function () {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });
})();
</script>
</body>
</html>
